[tools]
bat = "latest"
bat-extras = "latest"
bun = "latest"
codex = "latest"
docker-cli = "latest"
fzf = "latest"
ghq = "latest"

[bootstrap.services.mise-history]
builtin = "history-watch"

[env]
CODEX_HOME = "/home/mina/.config/codex"

[dotfiles]
"~/.bashrc" = { mode = "track" }
"~/.config/bat/themes" = { source="catppuccin/bat/themes", mode = "copy" }
"~/.config/git" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

[settings]
idiomatic_version_file_enable_tools = ["python"]

